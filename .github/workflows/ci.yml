name: CI

# Pull requests: tests and the app build on Node 20.19 (the minimum the packages support), and the release check.
# Pushes to main (and manual runs on main): the same tests, then the release job publishes every package under
# packages/ whose package.json version is not on the registry yet. To release, bump the version in the PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Release job packs and reports without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main never are, so a publish is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm test # app, then each package: typecheck, tests, generated files, dist consumer checks
      - run: npm run build # the sheet editor (Vite)

  release-check:
    name: Release check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff against the base branch
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: npm
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
      - run: npm ci --ignore-scripts
      # Changed packages must carry an unpublished version (that version is released when the PR is merged).
      - run: node scripts/release.mjs check --base origin/${{ github.base_ref }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

  release:
    name: Release packages
    needs: test # nothing publishes unless the tests pass
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # npm provenance
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes since the previous tag
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
          package-manager-cache: false # no build cache in a publishing job
      - run: npm ci
      # Publishes unpublished versions only (dependencies first), with a <dir>-v<version> tag and GitHub release each;
      # when nothing was bumped it just reports "already published".
      - run: node scripts/release.mjs publish ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # Provenance attestations need the public npm registry.
          NPM_PROVENANCE: ${{ vars.NPM_REGISTRY_URL == '' }}
